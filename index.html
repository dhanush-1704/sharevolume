<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Share Volume Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 h-screen flex items-center justify-center">
    <div class="bg-white shadow-md rounded px-8 pt-6 pb-8 mb-4">
        <h2 class="text-2xl font-bold mb-6 text-center">Share Volume Calculator</h2>
        <div class="mb-4">
            <label class="block text-gray-700 text-sm font-bold mb-2" for="sharePrice">
                Share Price:
            </label>
            <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="sharePrice" type="number" placeholder="Enter share price">
        </div>
        <div class="mb-4">
            <label class="block text-gray-700 text-sm font-bold mb-2" for="investmentAmount">
                Investment Amount:
            </label>
            <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="investmentAmount" type="number" placeholder="Enter investment amount">
        </div>
        <div class="mb-6">
            <label class="block text-gray-700 text-sm font-bold mb-2" for="totalShares">
                Total Shares:
            </label>
            <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="totalShares" type="number" placeholder="Total shares" readonly>
        </div>
        <div class="flex items-center justify-between">
            <button class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline" type="button" id="calculateBtn">
                Calculate
            </button>
            <button class="bg-red-500 hover:bg-red-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline" type="button" id="clearBtn">
                Clear
            </button>
        </div>
    </div>
    <script>
        document.getElementById('calculateBtn').addEventListener('click', function() {
            const sharePrice = parseFloat(document.getElementById('sharePrice').value);
            const investmentAmount = parseFloat(document.getElementById('investmentAmount').value);

            if (isNaN(sharePrice) || isNaN(investmentAmount)) {
                alert('Please enter valid numbers for both Share Price and Investment Amount.');
                return;
            }

            const totalShares = investmentAmount / sharePrice;
            document.getElementById('totalShares').value = totalShares.toFixed(2);
        });

        document.getElementById('clearBtn').addEventListener('click', function() {
            document.getElementById('sharePrice').value = '';
            document.getElementById('investmentAmount').value = '';
            document.getElementById('totalShares').value = '';
        });
    </script>
</body>
</html>
